name: Deploy

# ขึ้นเว็บอัตโนมัติทุกครั้งที่มีโค้ดใหม่ใน branch ที่ร้านใช้งาน — ทำแทน deploy.cmd
# ลำดับเหมือน deploy.cmd: เทสต์ → build → ขึ้นเว็บ → อัปเดตกฎฐานข้อมูล
# เทสต์ไม่ผ่านจะหยุดก่อน ไม่มีทางขึ้นเว็บที่พัง
#
# ต้องตั้ง Secret ใน GitHub ครั้งแรก (ดูขั้นตอนใน README หัวข้อ "ขึ้นเว็บอัตโนมัติ")
#   FIREBASE_SERVICE_ACCOUNT  ไฟล์กุญแจ JSON จาก Firebase Console ทั้งไฟล์   (ต้องมี)
#   ENV_FILE                  เนื้อหาไฟล์ .env ทั้งไฟล์                     (ไม่ใส่ก็ได้)
# ไม่มี ENV_FILE: ดึงค่าเชื่อมต่อจากเว็บร้านเอง (/__/firebase/init.json ที่ Firebase Hosting เปิดให้อยู่แล้ว)
#   ค่าพวกนี้เป็นค่าสาธารณะ อยู่ในโค้ดเว็บที่ทุกคนโหลดได้อยู่แล้ว ไม่ใช่ความลับ
# ยังไม่ได้ตั้งกุญแจ: ขั้นขึ้นเว็บจะถูกข้าม (ไม่ขึ้นแดง) แค่รันเทสต์กับ build

on:
  push:
    branches: [claude/pos-streetfood-analysis-lcawl7]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_SECRETS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Write .env
        if: env.HAS_SECRETS == 'true'
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          # ใช้ ENV_FILE เฉพาะเมื่อหน้าตาถูกต้อง (มีกุญแจเว็บและเป็นโปรเจกต์ร้าน)
          # วางผิดมา เช่นเอาไฟล์กุญแจ JSON มาใส่ ถ้าใช้ไปเว็บจะขึ้นไปแบบต่อฐานข้อมูลไม่ได้
          if [ -n "$ENV_FILE" ] \
            && printf '%s\n' "$ENV_FILE" | grep -Eq '^VITE_FIREBASE_API_KEY=.+' \
            && printf '%s\n' "$ENV_FILE" | grep -Eq '^VITE_FIREBASE_PROJECT_ID=pospos-b87bf\s*$'; then
            printf '%s\n' "$ENV_FILE" > .env
            echo "ใช้ค่าจาก Secret ENV_FILE"
          else
            if [ -n "$ENV_FILE" ]; then
              echo "::warning::ENV_FILE หน้าตาไม่ถูกต้อง (ต้องมีบรรทัด VITE_FIREBASE_API_KEY=... และ VITE_FIREBASE_PROJECT_ID=pospos-b87bf) — ไม่ใช้ ดึงค่าจากเว็บร้านแทน"
            fi
            curl -fsS https://pospos-b87bf.web.app/__/firebase/init.json -o "$RUNNER_TEMP/init.json"
            node -e '
              const c = require(process.argv[1]);
              const map = { apiKey: "API_KEY", authDomain: "AUTH_DOMAIN", projectId: "PROJECT_ID",
                storageBucket: "STORAGE_BUCKET", messagingSenderId: "MESSAGING_SENDER_ID",
                appId: "APP_ID", measurementId: "MEASUREMENT_ID" };
              if (!c.apiKey || !c.projectId) { console.error("init.json ไม่มีค่าเชื่อมต่อ"); process.exit(1) }
              const lines = Object.entries(map).map(([k, v]) => `VITE_FIREBASE_${v}=${c[k] ?? ""}`);
              require("fs").writeFileSync(".env", lines.join("\n") + "\n");
            ' "$RUNNER_TEMP/init.json"
            echo "ดึงค่าเชื่อมต่อจากเว็บร้าน (projectId: $(node -p "require('$RUNNER_TEMP/init.json').projectId"))"
          fi

      - name: Build
        run: npm run build

      - name: Write service account
        if: env.HAS_SECRETS == 'true'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          # รับกุญแจจากกล่องไหนก็ได้ที่เป็นไฟล์ JSON ของ service account จริง
          # (เคยวางสลับกล่องกัน) — ไม่พิมพ์เนื้อหากุญแจออกมาเด็ดขาด
          printf '%s' "$SA" > "$RUNNER_TEMP/sa-1.json"
          printf '%s' "$ENV_FILE" > "$RUNNER_TEMP/sa-2.json"
          node -e '
            const fs = require("fs")
            const pick = (file, label) => {
              try {
                const k = JSON.parse(fs.readFileSync(file, "utf8"))
                if (k.type === "service_account" && k.client_email && k.private_key) return { k, label }
              } catch {}
              return null
            }
            // มีกุญแจหลายอัน เลือกอันที่เป็นของโปรเจกต์ร้านก่อน
            const keys = [pick(process.argv[1], "FIREBASE_SERVICE_ACCOUNT"), pick(process.argv[2], "ENV_FILE")].filter(Boolean)
            keys.forEach((x) => console.log("เจอกุญแจใน " + x.label + " (โปรเจกต์ " + x.k.project_id + ")"))
            const found = keys.find((x) => x.k.project_id === "pospos-b87bf") || keys[0]
            if (!found) {
              console.error("::error::ไม่เจอกุญแจ service account ที่ถูกต้องใน Secret ไหนเลย — วางเนื้อหาไฟล์ .json จาก Firebase Console > Project settings > Service accounts ลงใน FIREBASE_SERVICE_ACCOUNT")
              process.exit(1)
            }
            if (found.k.project_id !== "pospos-b87bf") {
              console.error("::error::กุญแจเป็นของโปรเจกต์ " + found.k.project_id + " ไม่ใช่ pospos-b87bf — โหลดกุญแจใหม่จากโปรเจกต์ pospos")
              process.exit(1)
            }
            fs.writeFileSync(process.argv[3], JSON.stringify(found.k))
            console.log("ใช้กุญแจจาก Secret " + found.label + " (โปรเจกต์ " + found.k.project_id + ")")
            // ชื่อบัญชีของกุญแจ (ไม่ใช่ความลับ) — เอาไว้เทียบว่าให้สิทธิ์ใน IAM ถูกบัญชี
            console.log("บัญชีของกุญแจ: " + found.k.client_email)
          ' "$RUNNER_TEMP/sa-1.json" "$RUNNER_TEMP/sa-2.json" "$RUNNER_TEMP/sa.json"
          rm -f "$RUNNER_TEMP/sa-1.json" "$RUNNER_TEMP/sa-2.json"

      - name: Deploy website
        if: env.HAS_SECRETS == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx --yes firebase-tools@14.27.0 deploy --only hosting --project pospos-b87bf --non-interactive

      - name: Deploy database rules
        if: env.HAS_SECRETS == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          npx --yes firebase-tools@14.27.0 deploy --only firestore:rules,firestore:indexes --project pospos-b87bf --non-interactive || {
            echo "::error::อัปเดตกฎฐานข้อมูลไม่สำเร็จ (เว็บขึ้นแล้ว) — ถ้าขึ้น Permission denied ให้เพิ่มสิทธิ์ Firebase Admin และ Service Usage Consumer ให้บัญชีของกุญแจด้านบน ที่ IAM ของโปรเจกต์ pospos-b87bf"
            exit 1
          }

      - name: Remove service account
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json" "$RUNNER_TEMP/sa-1.json" "$RUNNER_TEMP/sa-2.json" "$RUNNER_TEMP/init.json" .env

      - name: Secrets not set
        if: env.HAS_SECRETS != 'true'
        env:
          SA_IN_VARS: ${{ vars.FIREBASE_SERVICE_ACCOUNT != '' }}
        run: |
          echo "ยังไม่มี Secret กุญแจขึ้นเว็บ (อยู่ในแท็บ Variables แทน: $SA_IN_VARS)"
          echo "::warning::ยังไม่ได้ขึ้นเว็บ — ตั้ง Secret กุญแจ Firebase ก่อน"
